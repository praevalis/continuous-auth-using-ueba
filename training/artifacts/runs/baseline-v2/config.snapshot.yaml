data:
  dataset_path: training\artifacts\input\lanl-auth-dataset-1-00.txt
  test_dataset_path: null
  delimiter: ','
  has_header: false
  row_limit: 2000000
  test_row_limit: null
  sampling_strategy: uniform
  read_chunk_size: 500000
  history_window_days: 30
  timestamp_column: timestamp
  timestamp_unit: s
  timestamp_origin: 2014-01-01
  user_column: user
  host_column: computer
split:
  validation_fraction: 0.15
  test_fraction: 0.15
  random_state: 32
autoencoder:
  epochs: 25
  learning_rate: 0.001
  batch_size: 128
isolation_forest:
  n_estimators: 100
  contamination: 0.01
  max_samples: auto
  random_state: 32
fusion:
  alpha: 0.5
  threshold_percentiles:
  - 95
  - 99
artifacts:
  output_dir: training\artifacts\runs
  run_name: baseline-v2
