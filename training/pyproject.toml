[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-training"
version = "0.1.0"
description = "Training pipeline project for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "continuous-auth-ml",
  "networkx",
  "numpy",
  "pandas",
  "PyYAML",
  "scikit-learn",
  "torch",
]

[project.scripts]
train-model = "training.train:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
