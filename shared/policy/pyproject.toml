[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-policy"
version = "0.1.0"
description = "Shared policy layer for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "continuous-auth-domain",
  "continuous-auth-schemas",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/policy"]

[tool.hatch.build.targets.wheel.force-include]
"src/policy/py.typed" = "policy/py.typed"
