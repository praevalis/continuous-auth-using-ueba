[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-database"
version = "0.1.0"
description = "Shared persistence layer for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "asyncpg",
  "continuous-auth-domain",
  "continuous-auth-schemas",
  "pydantic-settings",
  "sqlalchemy",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
