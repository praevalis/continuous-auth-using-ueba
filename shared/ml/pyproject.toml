[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-ml"
version = "0.1.0"
description = "Shared ML layer for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "continuous-auth-database",
  "continuous-auth-domain",
  "continuous-auth-schemas",
  "networkx",
  "numpy",
  "pandas",
  "scikit-learn",
  "torch",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.hatch.build.targets.wheel.force-include]
"src/ml/py.typed" = "ml/py.typed"
