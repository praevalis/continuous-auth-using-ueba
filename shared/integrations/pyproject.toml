[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-integrations"
version = "0.1.0"
description = "Shared external integrations for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "continuous-auth-domain",
  "continuous-auth-schemas",
  "httpx",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/integrations"]

[tool.hatch.build.targets.wheel.force-include]
"src/integrations/py.typed" = "integrations/py.typed"
