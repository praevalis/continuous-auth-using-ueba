[project]
name = "continuous-auth-using-ueba"
version = "0.1.0"
description = "Workspace root for the Continuous Authentication using UEBA platform."
requires-python = ">=3.13"
dependencies = [
  "alembic",
  "continuous-auth-api",
  "continuous-auth-cache",
  "continuous-auth-database",
  "continuous-auth-domain",
  "continuous-auth-event-broker",
  "continuous-auth-integrations",
  "continuous-auth-ml",
  "continuous-auth-policy",
  "continuous-auth-schemas",
  "mypy",
  "poethepoet",
  "pre-commit",
  "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "training",
  "shared/domain",
  "shared/schemas",
  "shared/database",
  "shared/cache",
  "shared/event_broker",
  "shared/ml",
  "shared/integrations",
  "shared/policy",
]

[tool.uv.sources]
continuous-auth-api = { workspace = true }
continuous-auth-domain = { workspace = true }
continuous-auth-schemas = { workspace = true }
continuous-auth-database = { workspace = true }
continuous-auth-cache = { workspace = true }
continuous-auth-event-broker = { workspace = true }
continuous-auth-ml = { workspace = true }
continuous-auth-integrations = { workspace = true }
continuous-auth-policy = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["infra/migrations/alembic/versions/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
pretty = true

[tool.poe.tasks.api]
cmd = "uv run uvicorn --app-dir apps/api/src api.main:app"

[tool.poe.tasks.api-dev]
cmd = "uv run uvicorn --app-dir apps/api/src api.main:app --reload"

[tool.poe.tasks.worker]
cmd = "uv run python --module worker.main"

[tool.poe.tasks.lint]
cmd = "uv run ruff check ."

[tool.poe.tasks.format]
cmd = "uv run ruff format ."

[tool.poe.tasks.dashboard-types]
cmd = "uv run python scripts/generate_dashboard_api_types.py"

[tool.poe.tasks.db-revision]
cmd = "uv run alembic -c infra/migrations/alembic.ini revision --autogenerate -m ${message}"
help = "Generate an Alembic revision with the provided message."
args = [{ name = "message", positional = true, required = true }]

[tool.poe.tasks.db-upgrade]
cmd = "uv run alembic -c infra/migrations/alembic.ini upgrade head"

[tool.poe.tasks.db-downgrade]
cmd = "uv run alembic -c infra/migrations/alembic.ini downgrade ${target}"
help = "Downgrade the database to the provided target revision."
args = [{ name = "target", positional = true, default = "-1" }]

[tool.poe.tasks.db-current]
cmd = "uv run alembic -c infra/migrations/alembic.ini current"

[tool.poe.tasks.db-history]
cmd = "uv run alembic -c infra/migrations/alembic.ini history"

[[tool.mypy.overrides]]
module = [
  "networkx",
  "pandas",
  "sklearn.*",
  "yaml",
]
ignore_missing_imports = true
