[project]
name = "continuous-auth-using-ueba"
version = "0.1.0"
description = "Workspace root for the Continuous Authentication using UEBA platform."
requires-python = ">=3.13"
dependencies = [
  "alembic",
  "continuous-auth-cache",
  "continuous-auth-database",
  "continuous-auth-domain",
  "continuous-auth-schemas",
  "mypy",
  "pre-commit",
  "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "training",
  "shared/domain",
  "shared/schemas",
  "shared/database",
  "shared/cache",
  "shared/ml",
  "shared/integrations",
  "shared/policy",
]

[tool.uv.sources]
continuous-auth-domain = { workspace = true }
continuous-auth-schemas = { workspace = true }
continuous-auth-database = { workspace = true }
continuous-auth-cache = { workspace = true }
continuous-auth-ml = { workspace = true }
continuous-auth-integrations = { workspace = true }
continuous-auth-policy = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["infra/migrations/alembic/versions/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "networkx",
  "pandas",
  "sklearn.*",
  "yaml",
]
ignore_missing_imports = true
