[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-auth-api"
version = "0.1.0"
description = "FastAPI application for the Continuous Authentication platform."
requires-python = ">=3.13"
dependencies = [
  "continuous-auth-cache",
  "continuous-auth-database",
  "continuous-auth-domain",
  "continuous-auth-event-broker",
  "continuous-auth-integrations",
  "continuous-auth-policy",
  "continuous-auth-schemas",
  "fastapi",
  "pydantic-settings",
  "uvicorn",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
