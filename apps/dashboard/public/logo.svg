<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 716" role="img" aria-labelledby="continuous-auth-ueba-title continuous-auth-ueba-description">
	<title id="continuous-auth-ueba-title">Continuous Authentication with UEBA</title>
	<desc id="continuous-auth-ueba-description">An abstract identity core surrounded by continuous assessment orbits and an amber behavioral anomaly pulse.</desc>

	<g fill="none" stroke-linecap="round" stroke-linejoin="round">
		<!-- Continuous reassessment orbit -->
		<path d="M 103 426 A 264 264 0 0 1 613 289" stroke="#667A68" stroke-width="31" />
		<path d="M 141 509 A 264 264 0 0 0 613 426" stroke="#3B4140" stroke-width="31" />

		<!-- Secondary behavioral context orbit -->
		<path d="M 274 179 A 198 198 0 1 0 471 520" stroke="#3B4140" stroke-width="30" />

		<!-- Identity core boundary -->
		<path d="M 317 244 A 121 121 0 1 0 399 244" stroke="#667A68" stroke-width="27" />

		<!-- Behavioral deviation / anomaly signal -->
		<path d="M 468 358 H 506 L 529 260 L 557 431 L 585 334 L 607 358 H 649" stroke="#A87528" stroke-width="27" />
	</g>

	<!-- Stable identity anchor -->
	<circle cx="358" cy="358" r="46" fill="#3B4140" />
</svg>
